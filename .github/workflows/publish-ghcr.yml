# SPDX-License-Identifier: MIT
name: Build, scan, attest, and publish safecli images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every third day of each month, not an exact 72-hour interval.
    - cron: '23 4 */3 * *'

permissions:
  contents: read

concurrency:
  group: safecli-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate scripts and container definitions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test shell and publisher rules
        run: |
          bash -n safecli.sh scripts/promote-image.sh scripts/install-cli-toolchain.sh scripts/generate-sboms.sh
          bash tests/test-containerfiles.sh
          bash tests/test-security-updates.sh
          bash tests/test-zypper-updates.sh
          bash tests/test-sbom-generation.sh
          bash tests/test-launcher.sh
          bash tests/test-promotion.sh

  publish:
    name: Build and verify ${{ matrix.profile }}
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        profile: [strict, usb, nested]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute image and candidate references
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.profile }}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "candidate=$image:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An image must be pushed to GHCR to scan its exact multi-architecture
      # digest. The unique candidate tag is not a release tag.
      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile.${{ matrix.profile }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.image.outputs.candidate }}
          sbom: true
          provenance: mode=min

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.2

      - name: Scan both architectures (block fixable HIGH / CRITICAL)
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p reports
          failed=0
          for arch in amd64 arm64; do
            echo "Scanning linux/$arch"
            if ! trivy image \
              --platform "linux/$arch" \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format json \
              --output "reports/${arch}.json" \
              "${IMAGE}@${DIGEST}"; then
              failed=1
            fi
          done
          if (( failed )); then
            echo 'Trivy detected fixable HIGH/CRITICAL vulnerabilities or scanning failed.' >&2
          fi
          exit "$failed"

      - name: Upload Trivy reports (even if scan fails)
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.profile }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Install Syft for per-architecture SPDX SBOMs
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate full SBOMs and digest manifest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SYFT_BIN: ${{ steps.syft.outputs.cmd }}
        run: bash scripts/generate-sboms.sh

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.profile }}
          path: sboms/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest build provenance in GitHub and GHCR
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # Large SBOMs cannot be used as sbom-path predicates (16 MiB limit).
      # Here the full files are the signed subjects, not oversized predicates.
      - name: Attest full SPDX SBOM files
        uses: actions/attest@v4
        with:
          subject-path: |
            sboms/amd64.spdx.json
            sboms/arm64.spdx.json

      # The small custom predicate binds both full SBOM hashes to the exact
      # multi-architecture image digest in GitHub and the OCI registry.
      - name: Attest full SBOM digests against image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://github.com/${{ github.repository }}/attestations/sbom-digests/v1
          predicate-path: sboms/sbom-digests.json
          push-to-registry: true
          create-storage-record: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Keyless-sign and verify exact multi-arch digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${IMAGE}@${DIGEST}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-ghcr.yml@${GITHUB_REF}"
          cosign sign --yes "$ref"
          cosign verify "$ref" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null

      # Only after scanning + SBOM + provenance + signature succeed do we
      # advance :latest or release version tags. The candidate remains in
      # GHCR for debugging even when a quality gate fails.
      - name: Promote verified digest to public-facing tags
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash scripts/promote-image.sh

      - name: Save published digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\t%s\n' "$IMAGE" "$DIGEST" > 'digests/${{ matrix.profile }}.txt'

      - name: Upload published digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.profile }}
          path: digests/${{ matrix.profile }}.txt
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Published image digests
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download digest records
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Summarize published images
        shell: bash
        run: |
          {
            echo '### Verified GHCR images'
            echo '| Profile | Image | Digest |'
            echo '|---|---|---|'
            for profile in strict usb nested; do
              IFS=$'\t' read -r image digest < "digests/${profile}.txt"
              printf '| `%s` | `%s` | `%s` |\n' "$profile" "$image" "$digest"
            done
            echo ''
            echo 'Each image passed Trivy checks for amd64/arm64, has full downloadable SBOMs with file provenance and an image-bound SBOM digest attestation, and was keyless-signed with Cosign.'
          } >> "$GITHUB_STEP_SUMMARY"
